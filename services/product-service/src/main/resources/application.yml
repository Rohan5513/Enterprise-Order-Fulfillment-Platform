spring:
  application:
    name: product-service

server:
  port: 8082
  shutdown: graceful          # finish in-flight requests before stopping

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true         # adds /actuator/health/liveness and /actuator/health/readiness
  metrics:
    tags:
      application: ${spring.application.name}   # lets Grafana filter metrics per service
